# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  subject: Fornax How-to Notebooks
  description: How-to notebooks for example Fornax use case scenarios
  keywords: [astronomy]
  github: https://github.com/nasa-fornax/fornax-howtos
  license:
    id: BSD-3-Clause
    url: https://github.com/nasa-fornax/fornax-howtos/blob/main/LICENSE
  references:
    fornax-docs: https://docs.fornax.sciencecloud.nasa.gov
  settings:
    output_matplotlib_strings: remove
  error_rules:
     - rule: reference-target-resolves
       severity: error
     - rule: link-resolves
       severity: ignore
       keys:
         # These link resolve in the browser but generates did not resolve and 403 for the build
extends:
  - toc.yml
site:
  template: book-theme
  options:
    favicon: _static/fornax_favicon.ico
    logo: _static/fornax_logo.png
